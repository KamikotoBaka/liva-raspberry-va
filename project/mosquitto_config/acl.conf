# Mosquitto ACL (Access Control List) File (optional)
# 
# Format:
# user <username>
# topic [read|write|readwrite] <topic>
# 
# Wildcards: + (single level), # (multi level)
# 
# Example:
# user liva_user
# topic write liva/commands/#
# topic read liva/status/#
# 
# Anonymous user:
# user
# topic readwrite #
# 
# For now, ACL is disabled in mosquitto.conf
# To enable:
# 1. Uncomment "acl_file /mosquitto/config/acl.conf" in mosquitto.conf
# 2. Restart mosquitto

# Allow anonymous users full access (while ACL is not enforced)
user
topic readwrite #
