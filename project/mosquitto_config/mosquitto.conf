# Mosquitto MQTT Broker Configuration for LIVA Voice Assistant

# =================
# Network Settings
# =================

# Listen on all interfaces, port 1883 (MQTT)
listener 1883
protocol mqtt
max_connections -1

# WebSocket listener on port 9001
listener 9001
protocol websockets

# Allow anonymous access (for local network use)
# For production, set to false and configure credentials
allow_anonymous true

# =================
# Persistence
# =================

# Enable persistence (store messages to disk)
persistence true
persistence_location /mosquitto/data/

# Specify the database filename
db_filename mosquitto.db

# =================
# Logging
# =================

# Log to file
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout

# Log level: debug, info, notice, warning, error
log_type all
log_timestamp true

# =================
# Performance
# =================

# Max queued messages per client
max_queued_messages 1000

# Message expiration time (seconds, 0 = never)
message_expiry_interval 3600

# Max inflight messages
max_inflight_messages 20

# =================
# Security
# =================

# Disable SSL/TLS for local network (enable if using remote)
# tls_version tlsv1.2
# certfile /mosquitto/certs/mosquitto.crt
# keyfile /mosquitto/certs/mosquitto.key

# =================
# ACL (Access Control List)
# =================

# Disable ACL (all clients can publish/subscribe)
# Set to true and configure acl_file for finer control
# acl_file /mosquitto/config/acl.conf
